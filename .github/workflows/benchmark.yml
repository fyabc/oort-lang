name: Benchmarks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmark history
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --python 3.12

      - name: Run benchmarks
        run: >-
          uv run --frozen pytest benchmarks/
          --benchmark-json=benchmark.json -q

      - name: Ensure benchmark history branch
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            exit 0
          fi
          git checkout --orphan gh-pages
          git rm -rf .
          printf '# Benchmark history\n' > README.md
          git add README.md
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore: initialize benchmark history"
          git push origin gh-pages

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: pytest
          output-file-path: benchmark.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: "150%"
          comment-on-alert: true
          fail-on-alert: false
