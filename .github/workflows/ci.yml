name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run --frozen ruff check src tests benchmarks scripts

      - name: Format check
        run: uv run --frozen ruff format --check src tests benchmarks scripts

      - name: Type check
        run: uv run --frozen mypy src/

      - name: Import boundaries
        run: uv run --frozen --with "import-linter>=2" lint-imports

      - name: Test
        run: uv run --frozen pytest tests/ --cov=src/oort_lang --cov-report=term-missing --cov-fail-under=87
